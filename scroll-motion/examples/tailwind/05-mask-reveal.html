<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>05 マスクリビール | scroll-motion（Tailwind版）</title>
<link rel="stylesheet" href="../_shared/demo-frame.css">
<style>
  /* カスタムCSS: Tailwind ユーティリティで表現できない部分（@keyframes / マスク / スクロール連動 / reduce 対応）。
     Tailwind プロジェクトへは、この block と <script> のロジックをコピーすれば同じ挙動になる。 */

  .mask-visual {
    height: 200px;
    border-radius: 12px;
    background: linear-gradient(135deg, #1d4ed8, #22d3ee 65%, #a5f3fc);
  }

  .mask-visual--warm {
    background: linear-gradient(135deg, #f59e0b, #ef4444 70%, #fecdd3);
  }

  @media (prefers-reduced-motion: no-preference) {
    .reveal-mask .mask-visual {
      clip-path: inset(0 100% 0 0);
      transition: clip-path 900ms cubic-bezier(0.22, 1, 0.36, 1);
    }

    .reveal-mask.is-visible .mask-visual {
      clip-path: inset(0 0 0 0);
    }

    .reveal-mask--vertical .mask-visual {
      clip-path: inset(100% 0 0 0);
    }

    .reveal-mask--vertical.is-visible .mask-visual {
      clip-path: inset(0 0 0 0);
    }

    /* clip-path が使えない環境ではフェードに差し替える */
    @supports not (clip-path: inset(0 100% 0 0)) {
      .reveal-mask .mask-visual,
      .reveal-mask--vertical .mask-visual {
        clip-path: none;
        opacity: 0;
        transition: opacity 900ms ease;
      }

      .reveal-mask.is-visible .mask-visual,
      .reveal-mask--vertical.is-visible .mask-visual {
        opacity: 1;
      }
    }
  }
</style>
<noscript><style>
  /* JS が無効な環境ではマスクを解除して図版をそのまま表示する */
  .reveal-mask .mask-visual,
  .reveal-mask--vertical .mask-visual {
    clip-path: none;
    opacity: 1;
  }
</style></noscript>
</head>
<body>
<main class="demo-shell">
  <a class="demo-back" href="../../showroom/index.html">← ショールームに戻る</a>
  <p class="demo-kicker">scroll-motion / 05 / mask-reveal / Tailwind版</p>
  <h1 class="demo-title">マスクリビール</h1>
  <p class="demo-lead">画像やカードを左から右へワイプ表示します。マスクは clip-path で作ります。</p>

  <section class="mb-14">
    <h2 class="mb-3 text-base font-semibold">左から右へワイプ</h2>
    <figure class="mask-figure reveal-mask m-0">
      <div class="mask-visual rounded-xl" role="img" aria-label="青から水色へのグラデーション図版"></div>
      <figcaption class="mt-3 text-sm text-slate-500"><code class="font-mono text-sm">clip-path: inset()</code> を 100% から 0 へ変化させています。</figcaption>
    </figure>
  </section>

  <section class="mb-14">
    <h2 class="mb-3 text-base font-semibold">2枚目は下から</h2>
    <div class="h-60"></div>
    <figure class="mask-figure reveal-mask reveal-mask--vertical m-0">
      <div class="mask-visual mask-visual--warm rounded-xl" role="img" aria-label="橙から赤へのグラデーション図版"></div>
    </figure>
  </section>

</main>
<footer class="demo-footer">
  <p>正本: <code>examples/tailwind/05-mask-reveal.html</code> / 演出カタログ: <code>catalog.json</code> / 実装ガイド: <code>references/implementation.md</code></p>
</footer>
<script>
  (function () {
    var targets = document.querySelectorAll('.reveal-mask');
    if (!('IntersectionObserver' in window)) {
      targets.forEach(function (element) { element.classList.add('is-visible'); });
      return;
    }
    var observer = new IntersectionObserver(function (entries) {
      entries.forEach(function (entry) {
        if (!entry.isIntersecting) { return; }
        entry.target.classList.add('is-visible');
        observer.unobserve(entry.target);
      });
    }, { threshold: 0.25 });
    targets.forEach(function (element) { observer.observe(element); });
  })();
</script>
</body>
</html>
