<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>10 パララックス | scroll-motion（Tailwind版）</title>
<link rel="stylesheet" href="../_shared/demo-frame.css">
<style>
  /* カスタムCSS: Tailwind ユーティリティで表現できない部分（@keyframes / マスク / スクロール連動 / reduce 対応）。
     Tailwind プロジェクトへは、この block と <script> のロジックをコピーすれば同じ挙動になる。 */

  .parallax {
    position: relative;
    display: grid;
    place-items: center;
    min-height: 420px;
    padding: 40px 0;
    margin-bottom: 56px;
    border-radius: 16px;
    background: #0f172a;
    overflow: hidden;
    /* このセクションの通過進捗を子要素が名前で参照する */
    view-timeline-name: --parallax;
    view-timeline-axis: block;
  }

  .parallax__layer {
    position: absolute;
    inset: -20% -10%;
    pointer-events: none;
  }

  .parallax__layer--back {
    background: radial-gradient(circle at 20% 30%, rgba(34, 211, 238, 0.35), transparent 55%),
      radial-gradient(circle at 80% 70%, rgba(29, 78, 216, 0.45), transparent 60%);
  }

  .parallax__layer--mid {
    background: radial-gradient(circle at 60% 20%, rgba(165, 243, 252, 0.2), transparent 45%),
      linear-gradient(180deg, transparent 45%, rgba(15, 23, 42, 0.85));
  }

  .parallax__content {
    position: relative;
    max-width: 420px;
    margin: 0 16px;
  }

  @keyframes parallax-back {
    from {
      transform: translate3d(0, -6%, 0);
    }

    to {
      transform: translate3d(0, 6%, 0);
    }
  }

  @keyframes parallax-mid {
    from {
      transform: translate3d(0, -14%, 0);
    }

    to {
      transform: translate3d(0, 14%, 0);
    }
  }

  @supports (animation-timeline: view()) {
    @media (prefers-reduced-motion: no-preference) {
      .parallax__layer--back {
        animation: parallax-back linear both;
        animation-timeline: --parallax;
      }

      .parallax__layer--mid {
        animation: parallax-mid linear both;
        animation-timeline: --parallax;
      }
    }
  }
</style>
</head>
<body>
<main class="demo-shell">
  <a class="demo-back" href="../../showroom/index.html">← ショールームに戻る</a>
  <p class="demo-kicker">scroll-motion / 10 / parallax / Tailwind版</p>
  <h1 class="demo-title">パララックス</h1>
  <p class="demo-lead">背景と前景を異なる速度で動かし、奥行きを作ります。本文は動く背景の上に直接置きません。</p>

  <section class="parallax" data-parallax-section>
    <div class="parallax__layer parallax__layer--back" data-parallax="0.6" aria-hidden="true"></div>
    <div class="parallax__layer parallax__layer--mid" data-parallax="1" aria-hidden="true"></div>
    <div class="parallax__content rounded-xl border border-slate-200 bg-white p-5">
      <h2 class="mb-2 text-base font-semibold">背景と前景を別々の速度で動かす</h2>
      <p>奥の層はゆっくり、手前の層は速く動きます。本文は読みやすさを優先して独立したカードに載せています。</p>
    </div>
  </section>

  <section class="mb-14">
    <h2 class="mb-3 text-base font-semibold">余白</h2>
    <div class="h-60"></div>
  </section>

</main>
<footer class="demo-footer">
  <p>正本: <code>examples/tailwind/10-parallax.html</code> / 演出カタログ: <code>catalog.json</code> / 実装ガイド: <code>references/implementation.md</code></p>
</footer>
<script>
  (function () {
    var reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
    var supportsTimeline = window.CSS && CSS.supports && CSS.supports('animation-timeline: view()');
    var sections = document.querySelectorAll('[data-parallax-section]');
    if (!sections.length || supportsTimeline || reduceMotion.matches) {
      return; /* CSS タイムラインがある環境、reduce では JS で動かさない */
    }
    var ticking = false;
    function update() {
      ticking = false;
      sections.forEach(function (section) {
        var rect = section.getBoundingClientRect();
        var span = window.innerHeight + rect.height;
        var progress = span > 0 ? (window.innerHeight - rect.top) / span : 0;
        progress = Math.max(0, Math.min(1, progress));
        var offset = (progress - 0.5) * 2;
        section.querySelectorAll('[data-parallax]').forEach(function (layer) {
          var strength = Number(layer.getAttribute('data-parallax')) || 1;
          layer.style.transform = 'translate3d(0, ' + (offset * 10 * strength).toFixed(2) + '%, 0)';
        });
      });
    }
    window.addEventListener('scroll', function () {
      if (ticking) { return; }
      ticking = true;
      window.requestAnimationFrame(update);
    }, { passive: true });
    window.addEventListener('resize', update);
    update();
  })();
</script>
</body>
</html>
