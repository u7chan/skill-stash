<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>05 マスクリビール | scroll-motion（CSS版）</title>
<link rel="stylesheet" href="../_shared/demo-frame.css">
<style>
  .mask-visual {
    height: 200px;
    border-radius: 12px;
    background: linear-gradient(135deg, #1d4ed8, #22d3ee 65%, #a5f3fc);
  }

  .mask-visual--warm {
    background: linear-gradient(135deg, #f59e0b, #ef4444 70%, #fecdd3);
  }

  @media (prefers-reduced-motion: no-preference) {
    .reveal-mask .mask-visual {
      clip-path: inset(0 100% 0 0);
      transition: clip-path 900ms cubic-bezier(0.22, 1, 0.36, 1);
    }

    .reveal-mask.is-visible .mask-visual {
      clip-path: inset(0 0 0 0);
    }

    .reveal-mask--vertical .mask-visual {
      clip-path: inset(100% 0 0 0);
    }

    .reveal-mask--vertical.is-visible .mask-visual {
      clip-path: inset(0 0 0 0);
    }

    /* clip-path が使えない環境ではフェードに差し替える */
    @supports not (clip-path: inset(0 100% 0 0)) {
      .reveal-mask .mask-visual,
      .reveal-mask--vertical .mask-visual {
        clip-path: none;
        opacity: 0;
        transition: opacity 900ms ease;
      }

      .reveal-mask.is-visible .mask-visual,
      .reveal-mask--vertical.is-visible .mask-visual {
        opacity: 1;
      }
    }
  }
</style>
</head>
<body>
<main class="demo-shell">
  <a class="demo-back" href="../../showroom/index.html">← ショールームに戻る</a>
  <p class="demo-kicker">scroll-motion / 05 / mask-reveal / CSS版</p>
  <h1 class="demo-title">マスクリビール</h1>
  <p class="demo-lead">画像やカードを左から右へワイプ表示します。マスクは clip-path で作ります。</p>

  <section class="demo-section">
    <h2>左から右へワイプ</h2>
    <figure class="mask-figure reveal-mask">
      <div class="mask-visual" role="img" aria-label="青から水色へのグラデーション図版"></div>
      <figcaption class="demo-note"><code>clip-path: inset()</code> を 100% から 0 へ変化させています。</figcaption>
    </figure>
  </section>

  <section class="demo-section">
    <h2>2枚目は下から</h2>
    <div class="demo-spacer"></div>
    <figure class="mask-figure reveal-mask reveal-mask--vertical">
      <div class="mask-visual mask-visual--warm" role="img" aria-label="橙から赤へのグラデーション図版"></div>
    </figure>
  </section>

</main>
<footer class="demo-footer">
  <p>正本: <code>examples/css/05-mask-reveal.html</code> / 演出カタログ: <code>catalog.json</code> / 実装ガイド: <code>references/implementation.md</code></p>
</footer>
<script>
  (function () {
    var targets = document.querySelectorAll('.reveal-mask');
    if (!('IntersectionObserver' in window)) {
      targets.forEach(function (element) { element.classList.add('is-visible'); });
      return;
    }
    var observer = new IntersectionObserver(function (entries) {
      entries.forEach(function (entry) {
        if (!entry.isIntersecting) { return; }
        entry.target.classList.add('is-visible');
        observer.unobserve(entry.target);
      });
    }, { threshold: 0.25 });
    targets.forEach(function (element) { observer.observe(element); });
  })();
</script>
</body>
</html>
